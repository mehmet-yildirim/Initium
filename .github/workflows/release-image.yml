# =============================================================================
# Publish the Initium agent runtime image to GHCR and attach it to the GitHub
# Release. Triggers on version tags (vX.Y.Z). Rebuild a tag from Actions →
# "Release agent image" → Run workflow.
#
# Canonical repo: ghcr.io/mehmet-yildirim/initium-agent
# Derived projects: this file is a no-op unless repository variable
# INITIUM_PUBLISH_IMAGE is "true" (then the image is ghcr.io/<owner>/<repo>-agent).
#
# First publish: GitHub Packages → initium-agent → Package settings →
# Change visibility to Public (GHCR defaults to private even on a public repo).
# =============================================================================
name: Release agent image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (vX.Y.Z)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-agent-image
  cancel-in-progress: false

jobs:
  image:
    name: Build, push, attest, sign
    if: github.repository == 'mehmet-yildirim/Initium' || vars.INITIUM_PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
      version: ${{ steps.names.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Image name and version
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          CANONICAL: ${{ github.repository == 'mehmet-yildirim/Initium' }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          if [ "$CANONICAL" = "true" ]; then
            image="ghcr.io/${owner}/initium-agent"
          else
            image="ghcr.io/${owner}/${repo}-agent"
          fi
          tag="${REF_NAME#refs/tags/}"
          version="${tag#v}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.names.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.names.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.names.outputs.tag }}
            type=raw,value=${{ steps.names.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .initium/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digest
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: GitHub Release
        if: github.repository == 'mehmet-yildirim/Initium'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.names.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
          VERSION: ${{ steps.names.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          notes="## Run the agent (no Initium checkout)

1. Download \`compose.yaml\` and \`agent.env.example\` from this release (or the curl lines below).
2. Save the env file as \`.env\`, set \`GIT_REPO_URL\`, one AI provider key, and \`GITHUB_TOKEN\`.
3. \`docker compose up -d\`

\`\`\`bash
curl -fsSL -o compose.yaml https://github.com/mehmet-yildirim/Initium/releases/download/${TAG}/compose.yaml
curl -fsSL -o .env https://github.com/mehmet-yildirim/Initium/releases/download/${TAG}/agent.env.example
# edit .env
docker compose up -d
\`\`\`

\`\`\`bash
docker pull ${IMAGE}:${VERSION}
docker pull ${IMAGE}@${DIGEST}
\`\`\`

linux/amd64. Verify: \`gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}\`

Guide: \`.initium/docs/agent/docker-agent.md\`
"
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing="$(gh release view "$TAG" --json body --jq .body)"
            body="$(mktemp)"
            printf '%s\n\n%s\n' "$notes" "$existing" > "$body"
            gh release edit "$TAG" --notes-file "$body"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes" --generate-notes
          fi
          gh release upload "$TAG" \
            ".initium/docker/compose.release.yml#compose.yaml" \
            ".initium/docker/.env.example#agent.env.example" \
            --clobber
